<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة المدرس - إدارة الهويات</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #34495e; color: white; }
        input { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>قائمة الطلاب المسجلين (أرقام الهويات)</h2>
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>رقم الهوية</th>
                    <th>الفصل</th>
                    <th>سلوك</th>
                    <th>مواظبة</th>
                    <th>المجموع</th>
                </tr>
            </thead>
            <tbody id="sBody"></tbody>
        </table>
        <button style="margin-top:10px; background:#2980b9; color:white; padding:10px; border:none; border-radius:5px; cursor:pointer;" onclick="save()">حفظ التعديلات</button>
    </div>

<script>
    // ملاحظة: في نظام حقيقي، الطلاب يظهرون هنا بمجرد تسجيل دخولهم
    let students = JSON.parse(localStorage.getItem('stDB')) || [];

    function render() {
        const b = document.getElementById('sBody'); b.innerHTML = '';
        students.forEach((st, i) => {
            let total = Number(st.s)+Number(st.m);
            b.innerHTML += `<tr>
                <td>${st.name}</td>
                <td style="color:blue; font-weight:bold">${st.idNum || 'غير مسجل'}</td>
                <td>${st.cls}</td>
                <td><input type="number" value="${st.s}" onchange="students[${i}].s=this.value;render()"></td>
                <td><input type="number" value="${st.m}" onchange="students[${i}].m=this.value;render()"></td>
                <td>${total}</td>
            </tr>`;
        });
    }

    function save() {
        localStorage.setItem('stDB', JSON.stringify(students));
        alert("تم الحفظ");
    }
    render();
</script>
</body>
</html>
